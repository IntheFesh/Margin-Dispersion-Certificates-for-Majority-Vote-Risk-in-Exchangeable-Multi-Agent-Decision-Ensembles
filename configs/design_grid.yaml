# Phase 1.2 no-GPU pre-check: scan informativeness on (alpha_bar, F, N, M) grid.
# N values are all ODD on purpose: under strict success-majority, even
# N introduces ties (which are counted as failures); odd N has no ties
# and yields cleaner certificate structure.
