F_grid_relative: [0.0, 0.05, 0.10, 0.20, 0.40, 0.60, 0.80]
N_grid:          [3, 7, 15, 31, 63, 127]
M_grid:          [100, 200, 500, 1000]
K:               256
delta_global:    0.05
epsilon_targets: [0.3, 0.2, 0.1]
