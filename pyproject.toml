[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "margin-dispersion-certificates"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy","pandas","scipy","scikit-learn","matplotlib","pyyaml","tqdm","pytest","torch","transformers","datasets"
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
